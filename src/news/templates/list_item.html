{% load humanize %}

<a href="#" class="list-group-teaser list-group-news-teaser list-group-item list-group-teaser-container link-trapeze-vertical">
  <div class="list-group-teaser-thumbnail">
    <img src="https://picsum.photos/400/225" alt="Illustration de la news" class="img-fluid">
  </div>
  <div class="list-group-teaser-content">
    <h3 class="h5 mb-1">{{ item.title }}</h3>
    <div class="list-group-teaser-excerpt small">
      Naviguer dans les zones difficiles d’accès du corps humain tout en conservant une précision extrême...
    </div>
    <div class="mt-1 d-flex align-items-center">
      {% if item.news.format %}
        <span class="tag tag-sm mt-1 border-light mr-2">
          {{ item.news.format }}
          {% if item.news.format.icon %}
            <svg class="icon" aria-hidden="true">
              <use xlink:href="{{ item.news.format.icon }}"></use>
            </svg>
          {% endif %}
        </span>
      {% endif %}
      <time datetime="{{ item.published_at|date:'Y-m-d' }}" title="{{ item.published_at }}" class="small mb-0 text-muted">
        {{ item.published_at|naturaltime }}
      </time>
    </div>
  </div>
</a>
