name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      packages: write
    name: Build and push image

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Build app image
        run: |
          docker build . \
            --target production \
            --no-cache \
            --file docker/django/Dockerfile \
            --tag actu

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'actu'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy.sarif'

      - name: Upload scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy.sarif'

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          IMAGE_ID=$(echo "ghcr.io/${{ github.repository }}" | tr '[A-Z]' '[a-z]')

          GIT_SHORT_HASH=$(git rev-parse --short "$GITHUB_SHA")
          DATE=$(date "+%Y%m%d%H%M%S")
          VERSION="$DATE.$GIT_SHORT_HASH.${{ github.run_number }}"
          echo "Push image $IMAGE_ID:$VERSION"

          docker tag actu $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:$VERSION

      - name: Push image with the GitHub tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          IMAGE_ID=$(echo "ghcr.io/${{ github.repository }}" | tr '[A-Z]' '[a-z]')
          TAG_NAME=$GITHUB_REF_NAME
          echo "Push image $IMAGE_ID:$TAG_NAME"

          docker tag actu $IMAGE_ID:$TAG_NAME
          docker push $IMAGE_ID:$TAG_NAME
