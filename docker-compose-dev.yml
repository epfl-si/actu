services:
  django:
    build:
      context: .
      target: development
      dockerfile: docker/django/Dockerfile
    image: local-django-actu
    container_name: local-django-actu
    entrypoint: docker/django/entrypoint-django-local.sh
    environment:
      - DJANGO_SETTINGS_MODULE=configs.settings
      - DJANGO_ALLOW_ASYNC_UNSAFE=true
      - ACTU_DATABASE_HOST=${ACTU_DATABASE_HOST}
      - ACTU_DATABASE_PORT=${ACTU_DATABASE_PORT}
      - ACTU_DATABASE_NAME=${ACTU_DATABASE_NAME}
      - ACTU_DATABASE_USER=${ACTU_DATABASE_USER}
      - ACTU_DATABASE_PASSWORD=${ACTU_DATABASE_PASSWORD}
      - ACTU_SECRET_KEY=${ACTU_SECRET_KEY}
      - ACTU_DEBUG_MODE=true
      - ACTU_SHOW_DEBUG_TOOLBAR=true
      - ACTU_TENANT_ID=${ACTU_TENANT_ID}
      - ACTU_OIDC_RP_CLIENT_ID=${ACTU_OIDC_RP_CLIENT_ID}
      - ACTU_OIDC_RP_CLIENT_SECRET=${ACTU_OIDC_RP_CLIENT_SECRET}
    volumes:
      - ./src:/app/src
      - ./docker:/app/docker
      - ./.flake8:/app/.flake8
      - ./.coveragerc:/app/.coveragerc
      - ./pyproject.toml:/app/pyproject.toml
    ports:
      - "8000:8000"
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.3-alpine
    container_name: local-postgres-actu
    environment:
      - POSTGRES_DB=${ACTU_DATABASE_NAME}
      - POSTGRES_USER=${ACTU_DATABASE_USER}
      - POSTGRES_PASSWORD=${ACTU_DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "25432:5432"
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U ${ACTU_DATABASE_USER} -d ${ACTU_DATABASE_NAME}"
      ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 2s

  playwright:
    image: mcr.microsoft.com/playwright:v1.59.0
    container_name: local-playwright-actu
    ipc: host
    init: true
    command: npx -y playwright@1.59.0 run-server --port 3651 --host 0.0.0.0
    ports:
      - "3651:3651"

volumes:
  postgres_data:
