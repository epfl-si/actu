{% load i18n %}

<div class="overlay"></div>
<nav class="nav-main" id="main-navigation">
  <div class="nav-wrapper">
    <div class="nav-container current-menu-parent">
      <ul class="nav-menu">
        {% for topic in main_topics %}
          <li id="menu-item-{{ topic.id }}">
            <a class="nav-item" href="#">{{ topic }}</a>
          </li>
        {% endfor %}
        <li class="menu-item-has-children">
          <a href="#" role="button">{% trans "Others" %}</a>
          <ul>
            <li class="nav-back d-xl-none">
              <a href="#">
                <svg class="icon" aria-hidden="true"><use xlink:href="#icon-chevron-left"></use></svg>
                {% trans "Others" %}
              </a>
            </li>
            {% for topic in other_topics %}
              <li>
                <a href="#">{{ topic }}</a>
              </li>
            {% endfor %}
          </ul>
          <a href="#" role="button" aria-hidden="true" class="nav-arrow">
            <div class="icon-container">
              <svg class="icon" aria-hidden="true"><use xlink:href="#icon-chevron-right"></use></svg>
            </div>
          </a>
        </li>
        <li>
          <a class="nav-item" href="{% url 'list_news' %}">
            <span>
              <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-search"></use>
              </svg>
            </span>
          </a>
      </ul>
    </div>
  </div>
</nav>
